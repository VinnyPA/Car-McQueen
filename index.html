<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c00000">
<title>🏎️ CAR MCQueen Control</title>
<style>
:root {
  --red: #d10000;
  --red-glow: #ff2020;
  --red-dk: #500000;
  --gold: #ffc500;
  --bg: #0a0a0a;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
body {
  background:
    radial-gradient(ellipse at center top, #4a0808 0%, #1a0303 50%, #000 100%),
    repeating-linear-gradient(45deg, transparent 0 2px, rgba(255,0,0,0.02) 2px 4px);
  background-attachment: fixed;
  color: #fff;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ===== HEADER ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: clamp(8px, 2vw, 14px) clamp(12px, 3vw, 24px);
  background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
  border-bottom: 1px solid rgba(255,0,0,0.2);
  font-size: clamp(0.65em, 1.8vw, 0.9em);
  gap: 8px;
  flex-shrink: 0;
}
.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: clamp(4px, 1vw, 8px);
  font-weight: bold;
  letter-spacing: 1px;
  white-space: nowrap;
}
.status-dot {
  width: clamp(8px, 1.5vw, 11px);
  height: clamp(8px, 1.5vw, 11px);
  border-radius: 50%;
  background: #f00;
  box-shadow: 0 0 8px #f00;
  flex-shrink: 0;
}
.status-dot.connected {
  background: #0f0;
  box-shadow: 0 0 10px #0f0;
}
.battery-bars {
  display: inline-flex; gap: 1px; align-items: center;
  padding: 2px 3px; border: 1.5px solid #0f0; border-radius: 3px;
  position: relative;
}
.battery-bars::after {
  content: ''; position: absolute; right: -4px; top: 3px;
  width: 2px; height: clamp(6px, 1.5vw, 8px); background: #0f0; border-radius: 0 2px 2px 0;
}
.battery-bars .bar {
  width: clamp(2px, 0.6vw, 4px);
  height: clamp(8px, 2vw, 12px);
  background: #0f0;
}
.title {
  font-size: clamp(0.75em, 2vw, 1.05em);
  font-weight: 900;
  letter-spacing: clamp(1px, 0.5vw, 3px);
  text-shadow: 0 0 10px rgba(255,0,0,0.5);
  text-align: center;
  flex: 1;
}

/* ===== LOGO 95 MCQUEEN ===== */
.logo {
  text-align: center;
  padding: clamp(4px, 1vw, 10px) 0 0;
  flex-shrink: 0;
}
.num-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2vw, 16px);
}
.bolt {
  font-size: clamp(1em, 3vw, 1.6em);
  color: var(--gold);
  filter: drop-shadow(0 0 8px rgba(255,200,0,0.8));
  animation: flash 2s infinite;
}
.bolt:last-child { transform: scaleX(-1); }
@keyframes flash {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.6; }
}
.num {
  font-size: clamp(1.8em, 7vw, 3em);
  font-weight: 900;
  background: linear-gradient(180deg, #ffd700 0%, #ff8c00 50%, #c00 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(255,200,0,0.4);
  letter-spacing: clamp(2px, 1vw, 4px);
  font-style: italic;
  line-height: 1;
}
.brand {
  font-size: clamp(0.9em, 3vw, 1.3em);
  font-weight: 900;
  color: var(--red);
  letter-spacing: clamp(2px, 1vw, 4px);
  text-shadow: 2px 2px 0 #000, 0 0 12px rgba(255,0,0,0.6);
  margin-top: -2px;
  font-style: italic;
}

/* ===== MAIN ===== */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  justify-items: center;
  gap: clamp(4px, 1.5vw, 16px);
  padding: clamp(4px, 1.5vw, 16px) clamp(8px, 2vw, 20px);
  min-height: 0;
}

/* ===== JOYSTICK ===== */
.joystick {
  --size: clamp(110px, min(30vw, 38vh), 210px);
  width: var(--size);
  height: var(--size);
  position: relative;
  background:
    radial-gradient(circle at 50% 50%, #0a0a0a 0%, #1a0a0a 60%, #2a0a0a 80%, #000 100%);
  border-radius: 50%;
  border: clamp(5px, 1.5vw, 10px) solid #1a1a1a;
  box-shadow:
    inset 0 0 30px rgba(255,0,0,0.5),
    inset 0 0 60px rgba(0,0,0,0.8),
    0 0 25px rgba(255,0,0,0.4),
    0 8px 18px rgba(0,0,0,0.6);
  touch-action: none;
  flex-shrink: 0;
}
.joystick::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 2px solid rgba(255,0,0,0.3);
  pointer-events: none;
}
.joystick-arrows {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  font-size: clamp(0.9em, 2.5vw, 1.6em);
  color: rgba(255,255,255,0.25);
}
.joystick-arrows .up    { grid-area: 1 / 2; justify-self: center; align-self: center; }
.joystick-arrows .down  { grid-area: 3 / 2; justify-self: center; align-self: center; }
.joystick-arrows .left  { grid-area: 2 / 1; justify-self: center; align-self: center; }
.joystick-arrows .right { grid-area: 2 / 3; justify-self: center; align-self: center; }

.joystick-knob {
  --knob-size: calc(var(--size) * 0.38);
  position: absolute;
  width: var(--knob-size);
  height: var(--knob-size);
  top: 50%;
  left: 50%;
  margin: calc(var(--knob-size) / -2) 0 0 calc(var(--knob-size) / -2);
  background:
    radial-gradient(circle at 35% 30%, #ff5050 0%, #c00 40%, #600 100%);
  border-radius: 50%;
  border: 3px solid #1a1a1a;
  box-shadow:
    0 0 20px rgba(255,40,40,0.9),
    inset 0 -6px 10px rgba(0,0,0,0.6),
    inset 0 3px 6px rgba(255,150,150,0.3);
  transition: transform 0.15s ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--size) * 0.13);
  color: rgba(255,255,255,0.5);
}
.joystick.dragging .joystick-knob {
  transition: none;
}

/* ===== PAINEL CENTRAL ===== */
.center-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(4px, 1.5vw, 10px);
  max-width: 100%;
}
.gauge {
  width: clamp(120px, 26vw, 200px);
  background:
    linear-gradient(180deg, #0a0a0a, #1a0505);
  border: 2px solid #2a0a0a;
  border-radius: 12px;
  padding: clamp(6px, 1.5vw, 12px) clamp(8px, 2vw, 14px);
  box-shadow:
    inset 0 0 15px rgba(255,0,0,0.3),
    0 4px 12px rgba(0,0,0,0.6);
  text-align: center;
}
.gauge-scale {
  display: flex;
  justify-content: space-between;
  font-size: clamp(0.55em, 1.4vw, 0.7em);
  color: rgba(255,255,255,0.5);
  margin-bottom: 4px;
}
.gauge-bar {
  height: clamp(8px, 2vw, 12px);
  background: rgba(0,0,0,0.6);
  border-radius: 5px;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(255,0,0,0.3);
}
.gauge-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffc500 0%, #ff6000 50%, #ff0000 100%);
  border-radius: 4px;
  transition: width 0.15s;
  box-shadow: 0 0 8px currentColor;
  width: 0%;
}
.gauge-label {
  font-size: clamp(0.55em, 1.4vw, 0.75em);
  color: rgba(255,255,255,0.7);
  letter-spacing: 2px;
  margin-top: 4px;
}
.gauge-value {
  font-size: clamp(1.1em, 3vw, 1.6em);
  font-weight: bold;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(255,200,0,0.6);
  line-height: 1.1;
}

.state-display {
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,0,0,0.3);
  padding: clamp(4px, 1.2vw, 7px) clamp(8px, 2.5vw, 18px);
  border-radius: 8px;
  font-size: clamp(0.75em, 2vw, 1em);
  font-weight: bold;
  letter-spacing: 1px;
  text-align: center;
  white-space: nowrap;
}

.brake-btn {
  width: clamp(70px, 18vw, 110px);
  padding: clamp(6px, 1.5vw, 12px) 0;
  background:
    linear-gradient(180deg, #1a0a0a 0%, #000 100%);
  border: 2px solid #2a0a0a;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-shadow:
    inset 0 0 12px rgba(255,0,0,0.4),
    0 5px 12px rgba(0,0,0,0.6);
  color: var(--red);
  font-weight: bold;
  font-size: clamp(0.7em, 1.7vw, 0.85em);
  letter-spacing: 2px;
}
.brake-btn .icon {
  font-size: clamp(1.1em, 3vw, 1.5em);
  color: var(--red);
  filter: drop-shadow(0 0 6px rgba(255,0,0,0.6));
  line-height: 1;
}
.brake-btn:active {
  transform: translateY(3px);
  box-shadow: inset 0 0 20px rgba(255,0,0,0.6);
}

/* ===== LANDSCAPE TIGHT ===== */
@media (orientation: landscape) and (max-height: 450px) {
  .logo { padding: 0; }
  .num { font-size: clamp(1.4em, 5vh, 2.2em); }
  .brand { font-size: clamp(0.7em, 2vh, 1em); }
  .header { padding: 4px 16px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">DEMO</span>
  </div>
  <div class="title">CONTROLE REMOTO</div>
  <div class="header-right">
    <span>BAT</span>
    <div class="battery-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <span>100%</span>
  </div>
</div>

<!-- LOGO -->
<div class="logo">
  <div class="num-row">
    <span class="bolt">⚡</span>
    <span class="num">95</span>
    <span class="bolt">⚡</span>
  </div>
  <div class="brand">MCQUEEN</div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- JOYSTICK ESQUERDO: FRENTE/RÉ -->
  <div class="joystick" id="joy-left">
    <div class="joystick-arrows">
      <div class="up">▲</div>
      <div class="down">▼</div>
    </div>
    <div class="joystick-knob">⇅</div>
  </div>

  <!-- PAINEL CENTRAL -->
  <div class="center-panel">
    <div class="gauge">
      <div class="gauge-scale"><span>0</span><span>50</span><span>100</span></div>
      <div class="gauge-bar"><div class="gauge-fill" id="gauge-fill"></div></div>
      <div class="gauge-label">VELOCIDADE</div>
      <div class="gauge-value" id="gauge-value">0%</div>
    </div>
    <div class="state-display" id="state">PARADO</div>
    <div class="brake-btn" id="brake">
      <div class="icon">⏻</div>
      <div>FREIO</div>
    </div>
  </div>

  <!-- JOYSTICK DIREITO: ESQUERDA/DIREITA -->
  <div class="joystick" id="joy-right">
    <div class="joystick-arrows">
      <div class="left">◀</div>
      <div class="right">▶</div>
    </div>
    <div class="joystick-knob">⇆</div>
  </div>

</div>

<script>
let ws = null;
let demoMode = true;

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const stateEl = document.getElementById('state');
const gaugeFill = document.getElementById('gauge-fill');
const gaugeValue = document.getElementById('gauge-value');

// ===== Joystick class =====
class Joystick {
  constructor(elementId, axis, onChange) {
    this.el = document.getElementById(elementId);
    this.knob = this.el.querySelector('.joystick-knob');
    this.axis = axis;
    this.onChange = onChange;
    this.maxRadius = 0;
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.pointerId = null;

    this.el.addEventListener('pointerdown', this.onDown.bind(this));
    this.el.addEventListener('pointermove', this.onMove.bind(this));
    this.el.addEventListener('pointerup', this.onUp.bind(this));
    this.el.addEventListener('pointercancel', this.onUp.bind(this));
    this.el.addEventListener('pointerleave', this.onUp.bind(this));
  }

  recalc() {
    const rect = this.el.getBoundingClientRect();
    this.cx = rect.left + rect.width / 2;
    this.cy = rect.top + rect.height / 2;
    const knobRect = this.knob.getBoundingClientRect();
    this.maxRadius = rect.width / 2 - knobRect.width / 2;
  }

  onDown(e) {
    e.preventDefault();
    this.active = true;
    this.pointerId = e.pointerId;
    this.el.setPointerCapture(e.pointerId);
    this.el.classList.add('dragging');
    this.recalc();
    this.update(e);
  }

  onMove(e) {
    if (!this.active || e.pointerId !== this.pointerId) return;
    this.update(e);
  }

  onUp(e) {
    if (!this.active) return;
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.knob.style.transform = '';
    this.el.classList.remove('dragging');
    if (this.onChange) this.onChange(0, 0);
  }

  update(e) {
    let dx = e.clientX - this.cx;
    let dy = e.clientY - this.cy;

    if (this.axis === 'vertical') dx = 0;
    if (this.axis === 'horizontal') dy = 0;

    const dist = Math.hypot(dx, dy);
    if (dist > this.maxRadius) {
      const a = Math.atan2(dy, dx);
      dx = Math.cos(a) * this.maxRadius;
      dy = Math.sin(a) * this.maxRadius;
    }
    this.x = this.maxRadius > 0 ? dx / this.maxRadius : 0;
    this.y = this.maxRadius > 0 ? dy / this.maxRadius : 0;

    this.knob.style.transform = `translate(${dx}px, ${dy}px)`;
    if (this.onChange) this.onChange(this.x, this.y);
  }
}

// ===== Differential drive =====
let leftY = 0, rightX = 0;
let lastThrottle = 99999;
let lastSteering = 99999;
const DEADZONE = 0.18;
const SEND_INTERVAL = 100;

function resolve() {
  let ly = Math.abs(leftY)  < DEADZONE ? 0 : leftY;
  let rx = Math.abs(rightX) < DEADZONE ? 0 : rightX;

  const throttle = Math.round(-ly * 255);
  const steering = Math.round( rx * 255);

  let stateName;
  const atThr = Math.abs(throttle) > 30;
  const atStr = Math.abs(steering) > 30;
  if (!atThr && !atStr)             stateName = '■ PARADO';
  else if (atThr && atStr) {
    if (throttle > 0 && steering > 0) stateName = '↗ FRENTE+DIR';
    else if (throttle > 0)            stateName = '↖ FRENTE+ESQ';
    else if (steering > 0)            stateName = '↘ RÉ+DIR';
    else                              stateName = '↙ RÉ+ESQ';
  }
  else if (atThr)                   stateName = throttle > 0 ? '▲ FRENTE' : '▼ RÉ';
  else                              stateName = steering > 0 ? '▶ DIREITA' : '◀ ESQUERDA';

  // Velocidade = só throttle linear (frente/ré). Curva não conta.
  const speedPct = Math.round(Math.abs(throttle) / 255 * 100);

  gaugeFill.style.width = speedPct + '%';
  gaugeValue.textContent = speedPct + '%';
  stateEl.textContent = stateName;

  return { throttle, steering, stateName };
}

let sendTimer = null;
function scheduleSend() {
  if (sendTimer) return;
  sendTimer = setTimeout(() => {
    sendTimer = null;
    const { throttle, steering } = resolve();
    if (throttle !== lastThrottle || steering !== lastSteering) {
      sendCmd(`c${throttle},${steering}`);
      lastThrottle = throttle;
      lastSteering = steering;
    }
  }, SEND_INTERVAL);
}

// ===== WebSocket =====
function tryConnect() {
  const host = window.location.hostname || '192.168.4.1';
  if (!host || host === 'localhost' || host === '127.0.0.1' || window.location.protocol === 'file:') {
    setDemoMode('DEMO');
    return;
  }
  try {
    ws = new WebSocket('ws://' + host + ':81');
    ws.onopen = () => {
      demoMode = false;
      statusDot.className = 'status-dot connected';
      statusText.textContent = 'CONECTADO';
    };
    ws.onclose = () => setDemoMode('OFFLINE');
    ws.onerror = () => setDemoMode('DEMO');
    setTimeout(() => { if (demoMode) tryConnect(); }, 3000);
  } catch (e) {
    setDemoMode('DEMO');
  }
}

function setDemoMode(msg) {
  demoMode = true;
  statusDot.className = 'status-dot';
  statusText.textContent = msg;
}

function sendCmd(cmd) {
  if (!demoMode && ws && ws.readyState === 1) {
    ws.send(cmd);
  }
  console.log('cmd:', cmd);
}

// ===== Wire up joysticks =====
const leftJoy = new Joystick('joy-left', 'vertical', (x, y) => {
  leftY = y;
  scheduleSend();
});
const rightJoy = new Joystick('joy-right', 'horizontal', (x, y) => {
  rightX = x;
  scheduleSend();
});

// Brake button
document.getElementById('brake').addEventListener('pointerdown', e => {
  e.preventDefault();
  leftY = 0; rightX = 0;
  if (leftJoy.active) leftJoy.onUp(e);
  if (rightJoy.active) rightJoy.onUp(e);
  sendCmd('s');
  stateEl.textContent = '■ PARADO';
  gaugeFill.style.width = '0%';
  gaugeValue.textContent = '0%';
  lastThrottle = 0;
  lastSteering = 0;
});

// Reposicionar joysticks ao virar tela
window.addEventListener('resize', () => {
  leftJoy.recalc();
  rightJoy.recalc();
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    leftJoy.recalc();
    rightJoy.recalc();
  }, 200);
});

// Init
tryConnect();
</script>
</body>
</html>
